<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>biteware</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome (social icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Particle Background -->
    <canvas id="particles"></canvas>

    <!-- Custom Cursor -->
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- ═════════════════════════════════════════════════════════════
         BIO CARD
         ═════════════════════════════════════════════════════════════ -->
    <div id="main-container">
        <div class="bio-card">

            <!-- ── Profile Picture ─────────────────────────────────── -->
            <div class="avatar-wrapper">
                <div class="avatar-ring"></div>
                <!-- EDIT: Replace src with your profile picture URL or local file -->
                <img src="averagewade.jpg" alt="avatar" class="avatar">
            </div>

            <!-- EDIT: Your username -->
            <h1 class="username">AverageWade</h1>

            <!-- EDIT: Your nickname / handle -->
            <p class="nickname">Average</p>

            <!-- EDIT: Your bio text (typewriter effect animates this) -->
            <p class="bio" id="bio" data-text="• u can see all my socials from here •"></p>

            <div class="divider"></div>

            <!-- ═══════════════════════════════════════════════════════
                 SOCIAL LINKS
                 EDIT: Replace href="#" with your links
                       Remove any <a> you don't need
                 ═══════════════════════════════════════════════════════ -->
            <div class="socials">
                <a href="https://www.youtube.com/@YourAveragePlayerInFrance" class="social-btn" title="YouTube" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i></a>
                <a href="https://www.tiktok.com/@averagewade" class="social-btn" title="TikTok" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i></a>
                <a href="https://github.com/Dinoul/" class="social-btn" title="GitHub" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
                <a href="https://steamcommunity.com/profiles/76561199147483845/" class="social-btn" title="Steam" target="_blank" rel="noopener noreferrer"><i class="fab fa-steam"></i></a>
            </div>

            <!-- ═══════════════════════════════════════════════════════
                 MUSIC PLAYER
                 ═══════════════════════════════════════════════════════ -->
            <div class="music-player">
                <div class="music-left">
                    <button class="play-btn" id="playBtn" aria-label="Play / pause music">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="music-info">
                        <!-- EDIT: Song title -->
                        <span class="track-title">Ou, Parameter.</span>
                        <!-- EDIT: Artist name -->
                        <span class="track-artist">Lil Bro</span>
                    </div>
                    <!-- Animated equalizer (visible when playing) -->
                    <div class="equalizer" id="equalizer">
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                    </div>
                </div>
                <div class="music-right">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <span class="time" id="durationTime">0:00</span>
                </div>
            </div>

            <!-- EDIT: Replace src with your music file URL (mp3, wav, etc.) -->
            <audio id="audioPlayer" src="mi-bombo.mp3" preload="metadata"></audio>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
